name: Binance funding monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_notification:
        description: Send one clearly labelled WeChat test notification
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: binance-funding-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run monitor
        id: monitor
        continue-on-error: ${{ inputs.test_notification == true }}
        run: node run-monitor.mjs
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          TEST_NOTIFICATION: ${{ inputs.test_notification }}

      - name: Send cloud test notification
        if: ${{ inputs.test_notification == true }}
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.PUSHPLUS_TOKEN;
          if (!token) throw new Error("PUSHPLUS_TOKEN is not configured");
          const content = [
            "### Cloud monitor test passed",
            "- PushPlus WeChat channel accepted this message",
            "- This is a cloud monitor test, not a trading signal and not an order",
            "- Binance market-data failures, if any, are recorded separately from this channel test",
          ].join("\\n");
          const response = await fetch("https://www.pushplus.plus/send", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ token, title: "Cloud monitor test passed", content, template: "markdown" }),
          });
          const body = await response.json().catch(() => ({}));
          if (!response.ok || (body.code !== undefined && body.code !== 200)) {
            throw new Error(`PushPlus test failed: ${response.status} ${JSON.stringify(body)}`);
          }
          console.log("PushPlus cloud test accepted");
          NODE
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}

      - name: Save cooldown state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monitor-state.json
          git diff --cached --quiet || git commit -m "chore: update monitor state"
          git push
