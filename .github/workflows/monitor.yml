name: Binance funding monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_notification:
        description: 发送一条明确标注的微信测试通知
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: binance-funding-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run monitor
        id: monitor
        continue-on-error: ${{ inputs.test_notification == true }}
        run: node run-monitor.mjs
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          TEST_NOTIFICATION: ${{ inputs.test_notification }}

      - name: 发送云端测试通知
        if: ${{ inputs.test_notification == true }}
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.PUSHPLUS_TOKEN;
          if (!token) throw new Error("PUSHPLUS_TOKEN is not configured");
          const content = [
            "### 云端监控测试成功",
            "- PushPlus 微信通道已接收此消息",
            "- 这是云端监控测试，不是交易信号，也不是订单",
            "- Binance 行情数据若有异常，会与本次消息通道测试分开记录",
          ].join("\\n");
          const response = await fetch("https://www.pushplus.plus/send", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ token, title: "云端监控测试成功", content, template: "markdown" }),
          });
          const body = await response.json().catch(() => ({}));
          if (!response.ok || (body.code !== undefined && body.code !== 200)) {
            throw new Error(`PushPlus test failed: ${response.status} ${JSON.stringify(body)}`);
          }
          console.log("PushPlus 云端测试消息已接收");
          NODE
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}

      - name: Save cooldown state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monitor-state.json
          git diff --cached --quiet || git commit -m "chore: update monitor state"
          git push
